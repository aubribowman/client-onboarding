<div class="shell">
  <header class="sidebar">
    <a routerLink="/" class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 L24 7 L28 12 Z" fill="currentColor" stroke="none"/><rect x="20.5" y="13" width="7" height="5" rx="1" fill="currentColor" stroke="none"/><path d="M21 20 H27 L28.6 37 H19.4 Z" fill="currentColor" stroke="none"/><path d="M31 14 L41 10.5 M31 17 L41 20.5" stroke-width="2.5" opacity="0.6"/><path d="M6 41 q4.5 -3.5 9 0 t9 0 t9 0 t9 0" stroke-width="3.5"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Harbor Point</span>
        <span class="brand-sub">Client onboarding</span>
      </span>
    </a>

    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/></svg>
        Home
      </a>
      <a routerLink="/new" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        New application
      </a>
      <a routerLink="/applications" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        Review queue
      </a>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
<app-toast />
