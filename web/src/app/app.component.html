<div class="shell">
  <header class="sidebar">
    <a routerLink="/" class="brand">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3 0 3-2 6-2s3 2 6 2 3-2 6-2"/><path d="M12 3v9"/><path d="M7.5 7.5 12 3l4.5 4.5"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Harbor Point</span>
        <span class="brand-sub">Client onboarding</span>
      </span>
    </a>

    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        New application
      </a>
      <a routerLink="/applications" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
        Review queue
      </a>
    </nav>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
